version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: happydrives-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: happy_drives
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - happydrives-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: happydrives-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - happydrives-network
    volumes:
      - ./app:/app/app
    environment:
      - MONGO_URL=mongodb://mongodb:27017

networks:
  happydrives-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
